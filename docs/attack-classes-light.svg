<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" width="1200" height="468" role="img" aria-label="Three classes of Minecraft DDoS attack and where each is mitigated" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328">Three attack classes, three different answers</text>
<text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">A defense built for one class does nothing against another.</text>
<rect x="20.0" y="84" width="370.7" height="356" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="46.0" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#8c959f">01</text>
<text x="46.0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">L4 volumetric floods</text>
<rect x="46.0" y="168" width="318.7" height="36" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<text x="58.0" y="191" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0550ae">SYN  ·  UDP amplification  ·  ACK</text>
<circle cx="49.0" cy="235" r="2.5" fill="#8c959f"/>
<text x="62.0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">Saturates your uplink or connection table</text>
<circle cx="49.0" cy="263" r="2.5" fill="#8c959f"/>
<text x="62.0" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">High bandwidth, mostly spoofed sources</text>
<circle cx="49.0" cy="291" r="2.5" fill="#8c959f"/>
<text x="62.0" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">Easy to detect, hard to absorb locally</text>
<line x1="46.0" y1="342" x2="364.7" y2="342" stroke="#d1d9e0" stroke-width="1"/>
<text x="46.0" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8c959f">MITIGATED AT</text>
<rect x="46.0" y="382" width="203.0" height="30" rx="6" fill="#8250df"/>
<text x="147.5" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Upstream / edge scrubbing</text>
<rect x="414.7" y="84" width="370.7" height="356" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="440.7" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#8c959f">02</text>
<text x="440.7" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">L7 Minecraft bot floods</text>
<rect x="440.7" y="168" width="318.7" height="36" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<text x="452.7" y="191" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0550ae">handshake  ·  status ping  ·  login</text>
<circle cx="443.7" cy="235" r="2.5" fill="#8c959f"/>
<text x="456.7" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">Valid protocol over real TCP connections</text>
<circle cx="443.7" cy="263" r="2.5" fill="#8c959f"/>
<text x="456.7" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">Low bandwidth, exhausts Netty workers</text>
<circle cx="443.7" cy="291" r="2.5" fill="#8c959f"/>
<text x="456.7" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">A generic firewall cannot tell it apart</text>
<line x1="440.7" y1="342" x2="759.3" y2="342" stroke="#d1d9e0" stroke-width="1"/>
<text x="440.7" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8c959f">MITIGATED AT</text>
<rect x="440.7" y="382" width="165.0" height="30" rx="6" fill="#8250df"/>
<text x="523.2" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Protocol-aware layer</text>
<rect x="809.3" y="84" width="370.7" height="356" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="835.3" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#8c959f">03</text>
<text x="835.3" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">RakNet / Bedrock UDP floods</text>
<rect x="835.3" y="168" width="318.7" height="36" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<text x="847.3" y="191" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0550ae">0x05  open connection request</text>
<circle cx="838.3" cy="235" r="2.5" fill="#8c959f"/>
<text x="851.3" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">No handshake, sources trivially spoofed</text>
<circle cx="838.3" cy="263" r="2.5" fill="#8c959f"/>
<text x="851.3" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">Session state lives in the application</text>
<circle cx="838.3" cy="291" r="2.5" fill="#8c959f"/>
<text x="851.3" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">Most generic products handle this poorly</text>
<line x1="835.3" y1="342" x2="1154.0" y2="342" stroke="#d1d9e0" stroke-width="1"/>
<text x="835.3" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8c959f">MITIGATED AT</text>
<rect x="835.3" y="382" width="180.2" height="30" rx="6" fill="#8250df"/>
<text x="925.4" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Stateful UDP filtering</text>
</svg>